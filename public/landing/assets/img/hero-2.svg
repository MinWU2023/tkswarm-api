<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="任务批次执行：流水线步骤与批次进度">
  <defs>
    <linearGradient id="s2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#fdf7f0"/>
    </linearGradient>
    <linearGradient id="s2accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb75c"/>
      <stop offset="1" stop-color="#ec7f11"/>
    </linearGradient>
    <radialGradient id="s2glow" cx="0.5" cy="0" r="0.72">
      <stop offset="0" stop-color="#ffcb8c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcb8c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s2grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#c9761f" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="s2shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#a4713a" flood-opacity="0.22"/>
    </filter>
    <clipPath id="s2win"><rect x="90" y="70" width="1420" height="760" rx="28"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#s2bg)"/>
  <rect width="1600" height="900" fill="url(#s2grid)"/>
  <ellipse cx="800" cy="-40" rx="760" ry="360" fill="url(#s2glow)"/>

  <rect x="90" y="70" width="1420" height="760" rx="28" fill="#ffffff" stroke="#ecdac7" filter="url(#s2shadow)"/>
  <g clip-path="url(#s2win)">
    <rect x="90" y="70" width="1420" height="64" fill="#f8ece0"/>
    <circle cx="130" cy="102" r="7" fill="#f26d5b"/>
    <circle cx="158" cy="102" r="7" fill="#f7bf4f"/>
    <circle cx="186" cy="102" r="7" fill="#59b76b"/>
    <text x="222" y="109" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#6b564a">TkSwarm · 任务批次</text>
    <rect x="1310" y="86" width="170" height="36" rx="18" fill="#ffffff" stroke="#ecdac7"/>
    <circle cx="1334" cy="104" r="5" fill="#f7921e"/>
    <text x="1350" y="111" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#b1580b">3 个批次执行中</text>

    <!-- left: pipeline -->
    <rect x="90" y="134" width="410" height="696" fill="#fcf7f1"/>
    <line x1="500" y1="134" x2="500" y2="830" stroke="#f0e2d2"/>
    <text x="122" y="192" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" letter-spacing="1.5" fill="#a1897a">执行流水线</text>

    <line x1="152" y1="252" x2="152" y2="576" stroke="#ecdac7" stroke-width="2"/>
    <!-- step 1 done -->
    <circle cx="152" cy="252" r="16" fill="#fdf0dc" stroke="#f7921e55"/>
    <path d="M145 252l5 5 9-10" fill="none" stroke="#b1580b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="188" y="246" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#1d1310">素材编排</text>
    <text x="188" y="272" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#a1897a">已完成 · 128 条素材</text>
    <!-- step 2 done -->
    <circle cx="152" cy="360" r="16" fill="#fdf0dc" stroke="#f7921e55"/>
    <path d="M145 360l5 5 9-10" fill="none" stroke="#b1580b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="188" y="354" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#1d1310">环境分配</text>
    <text x="188" y="380" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#a1897a">已完成 · 320 个环境</text>
    <!-- step 3 running -->
    <circle cx="152" cy="468" r="20" fill="#ffffff" stroke="#ecdac7" stroke-width="8"/>
    <circle cx="152" cy="468" r="20" fill="none" stroke="#f7921e" stroke-width="8" stroke-dasharray="76 50" stroke-linecap="round" transform="rotate(-90 152 468)"/>
    <text x="188" y="462" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#b1580b">发布执行</text>
    <text x="188" y="488" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#6b564a">进行中 · 262 / 320</text>
    <!-- step 4 pending -->
    <circle cx="152" cy="576" r="14" fill="#ffffff" stroke="#ecdac7" stroke-width="3"/>
    <text x="188" y="570" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="19" fill="#a1897a">结果回看</text>
    <text x="188" y="596" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#c6ae96">待执行</text>

    <rect x="122" y="700" width="346" height="96" rx="16" fill="#ffffff" stroke="#ecdac7"/>
    <text x="146" y="736" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#a1897a">失败原因</text>
    <text x="146" y="766" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#6b564a">代理超时 5 · 登录失效 3</text>

    <!-- right: batch cards -->
    <text x="540" y="186" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#1d1310">今日批次</text>
    <text x="540" y="220" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#6b564a">发布、养号、私信各自成批，进度与失败原因可回看</text>

    <!-- card 1 -->
    <rect x="540" y="252" width="900" height="156" rx="18" fill="#ffffff" stroke="#ecdac7"/>
    <text x="572" y="296" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d1310">发布批次 #2041</text>
    <rect x="820" y="278" width="92" height="28" rx="8" fill="#fdf0dc" stroke="#f7921e33"/>
    <text x="866" y="298" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" text-anchor="middle" fill="#b1580b">进行中</text>
    <text x="572" y="330" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#6b564a">目标 320 个账号 · 每账号 1 条短视频</text>
    <rect x="572" y="352" width="720" height="12" rx="6" fill="#f4e7d8"/>
    <rect x="572" y="352" width="590" height="12" rx="6" fill="url(#s2accent)"/>
    <text x="1312" y="364" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#6b564a">82%</text>
    <text x="572" y="392" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#59b76b">成功 262</text>
    <text x="672" y="392" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#c8341f">失败 8</text>
    <text x="772" y="392" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#a1897a">排队 50</text>

    <!-- card 2 -->
    <rect x="540" y="428" width="900" height="156" rx="18" fill="#ffffff" stroke="#ecdac7"/>
    <text x="572" y="472" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d1310">养号批次 #2042</text>
    <rect x="820" y="454" width="92" height="28" rx="8" fill="#f0f8ee" stroke="#59b76b55"/>
    <text x="866" y="474" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" text-anchor="middle" fill="#3d7a44">已完成</text>
    <text x="572" y="506" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#6b564a">180 个账号 · 浏览 + 点赞 + 评论回复</text>
    <rect x="572" y="528" width="720" height="12" rx="6" fill="#f4e7d8"/>
    <rect x="572" y="528" width="720" height="12" rx="6" fill="url(#s2accent)"/>
    <text x="1312" y="540" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#6b564a">100%</text>
    <text x="572" y="568" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#59b76b">成功 180</text>
    <text x="672" y="568" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#a1897a">失败 0</text>

    <!-- card 3 -->
    <rect x="540" y="604" width="900" height="156" rx="18" fill="#ffffff" stroke="#ecdac7"/>
    <text x="572" y="648" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#1d1310">私信批次 #2043</text>
    <rect x="820" y="630" width="92" height="28" rx="8" fill="#fdf0dc" stroke="#f7921e33"/>
    <text x="866" y="650" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" text-anchor="middle" fill="#b1580b">进行中</text>
    <text x="572" y="682" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#6b564a">AI 筛选后的 240 个潜在客户</text>
    <rect x="572" y="704" width="720" height="12" rx="6" fill="#f4e7d8"/>
    <rect x="572" y="704" width="266" height="12" rx="6" fill="url(#s2accent)"/>
    <text x="1312" y="716" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#6b564a">37%</text>
    <text x="572" y="744" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#59b76b">成功 89</text>
    <text x="672" y="744" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#c8341f">失败 2</text>
    <text x="772" y="744" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#a1897a">排队 149</text>
  </g>

  <circle cx="100" cy="866" r="5" fill="#f7921e"/>
  <text x="118" y="873" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="22" fill="#a1897a">02 · 任务批次：排队、执行与失败原因全程可回看</text>
</svg>
