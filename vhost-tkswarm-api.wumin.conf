# Nginx 虚拟主机配置 (本地开发环境)
# 文件可放置于你的 nginx/conf/vhosts/ 或 conf.d/ 目录下

server {
    listen 80;
    server_name tkswarm-api.dyyweb.com;

    # 关键：网站根目录必须指向 public/ 目录！
    root D:/WorkSpace/Projects/TkSwarm-Rebuild/tkswarm-api/public;

    index index.php index.html;
    charset utf-8;

    # 跨域设置（允许前端跨域调用）
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        # 核心伪静态：将所有请求交由 index.php 处理
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP FastCGI 支持
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000; # 请根据你本地环境 php-cgi 的端口设置（如 9000 或 9001）
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    location ~ /\.ht {
        deny all;
    }
}
