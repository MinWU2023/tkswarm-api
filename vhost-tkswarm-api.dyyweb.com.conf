# Nginx 站点示例：tkswarm-api.dyyweb.com（宝塔 / 独立 Nginx 均可参考）
# 网站根目录 = 代码里的 public 目录（与 migrate.php、index.php 同级）

server {
    listen 80;
    server_name tkswarm-api.dyyweb.com;

    # 按实际路径修改，必须与 migrate.php 所在目录一致
    root /www/wwwroot/tkswarm-api.dyyweb.com/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 100m;

    # 跨域：404/500 也要带 CORS，否则浏览器只显示「跨域」
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary Origin always;

    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }
}
